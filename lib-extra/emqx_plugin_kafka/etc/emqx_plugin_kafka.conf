##====================================================================
## Kafka Plugin
##====================================================================

## Kafka bootstrap hosts. Separate multiple hosts with comma.
##
## Value: host:port[,host:port]
kafka.hosts = 10.10.10.244:9092

## brod client id.
kafka.client_id = emqx_plugin_kafka

## MQTT publish to Kafka switch.
kafka.producer.enabled = true

## Encode MQTT payload with base64 before writing Kafka.
kafka.producer.publish_base64 = false

## MQTT topic filters excluded from publishing to Kafka.
## Separate multiple filters with comma. Exclusion has higher priority than
## producer rules.
# kafka.producer.excluded_topics = internal/#, alarm/debug/#

## Producer rules. Every matching MQTT topic filter publishes to its Kafka topic.
##
## Format:
##   kafka.producer.rule.<No>.mqtt_topic = <MQTT topic filter>
##   kafka.producer.rule.<No>.kafka_topic = <Kafka topic>
kafka.producer.rule.1.mqtt_topic = sensor/+/up
kafka.producer.rule.1.kafka_topic = kafka_sensor_up
kafka.producer.rule.2.mqtt_topic = alarm/#
kafka.producer.rule.2.kafka_topic = kafka_alarm

## Kafka consumer switch.
kafka.consumer.enabled = true

## Kafka consumer group id.
kafka.consumer.group_id = emqx_plugin_kafka

## Kafka topics to consume. Separate multiple topics with comma.
kafka.consumer.topics = mqtt_downlink

## Consumer begin offset: earliest | latest.
kafka.consumer.begin_offset = earliest

## MQTT client connection lifecycle events publishing switch.
kafka.connection_events.enabled = false

## Kafka topic for MQTT client connect/disconnect lifecycle events.
kafka.connection_events.topic = mqtt_connection_events

## Additional brod client/producers/consumer options are configured in
## etc/plugins/emqx_plugin_kafka.config when advanced Erlang terms are needed.
